name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # hermes-live/ holds the :hermes client library.
          submodules: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default adds the retired 'tools' package, which newer sdkmanagers reject.
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v4

      # Build only: tests and lint run locally before every merge (user, 2026-10-14).
      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon
