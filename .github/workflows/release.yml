name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # hermes-live/ holds the :hermes client library.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The action's default adds the retired 'tools' package, which newer sdkmanagers reject.
          packages: platform-tools platforms;android-37.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          FOLIO_KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOLIO_KEYSTORE_BASE64"
          printenv FOLIO_KEYSTORE_BASE64 | base64 -d > "$RUNNER_TEMP/folio-release.keystore"
          chmod 600 "$RUNNER_TEMP/folio-release.keystore"

      - name: Read versionName
        id: ver
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          LIVE_VERSION="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' hermes-live/live/build.gradle.kts | head -1)"
          test -n "$LIVE_VERSION"
          echo "live_version=$LIVE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag v${TAG_VERSION} does not match versionName ${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Assemble release
        env:
          FOLIO_STORE_FILE: ${{ runner.temp }}/folio-release.keystore
          FOLIO_STORE_PASSWORD: ${{ secrets.FOLIO_STORE_PASSWORD }}
          FOLIO_KEY_ALIAS: folio
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
          # Default diagnostics endpoint baked into release builds (repo variable; empty = off).
          FOLIO_DIAGNOSTICS_URL: ${{ vars.FOLIO_DIAGNOSTICS_URL }}
        run: ./gradlew assembleRelease --no-daemon

      # Hermes Live (submodule pin) is its own Gradle build. Same key as Folio: both apps
      # declare the signature permission com.folio.permission.HERMES.
      - name: Assemble Hermes Live
        working-directory: hermes-live
        env:
          FOLIO_STORE_FILE: ${{ runner.temp }}/folio-release.keystore
          FOLIO_STORE_PASSWORD: ${{ secrets.FOLIO_STORE_PASSWORD }}
          FOLIO_KEY_ALIAS: folio
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
          FOLIO_DIAGNOSTICS_URL: ${{ vars.FOLIO_DIAGNOSTICS_URL }}
        run: ./gradlew :live:assembleRelease --no-daemon

      - name: Package APKs
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          APK="folio-${VERSION}.apk"
          cp "$SRC" "$APK"
          sha256sum "$APK" | tee "${APK}.sha256"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          LIVE_APK="hermes-live-${{ steps.ver.outputs.live_version }}.apk"
          cp hermes-live/live/build/outputs/apk/release/live-release.apk "$LIVE_APK"
          sha256sum "$LIVE_APK" | tee "${LIVE_APK}.sha256"
          "$SIGNER" verify --verbose --print-certs "$LIVE_APK"
          # Same signer, or Folio can't read Hermes Live's connection.
          test "$("$SIGNER" verify --print-certs "$APK" | grep SHA-256)" = "$("$SIGNER" verify --print-certs "$LIVE_APK" | grep SHA-256)"
          echo "live_apk=$LIVE_APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ steps.ver.outputs.version }}
          path: |
            folio-${{ steps.ver.outputs.version }}.apk
            folio-${{ steps.ver.outputs.version }}.apk.sha256
            ${{ steps.pkg.outputs.live_apk }}
            ${{ steps.pkg.outputs.live_apk }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.ver.outputs.version }}" \
            --generate-notes \
            "${{ steps.pkg.outputs.apk }}" \
            "${{ steps.pkg.outputs.apk }}.sha256" \
            "${{ steps.pkg.outputs.live_apk }}" \
            "${{ steps.pkg.outputs.live_apk }}.sha256"
