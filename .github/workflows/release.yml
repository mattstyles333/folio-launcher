name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          FOLIO_KEYSTORE_BASE64: ${{ secrets.FOLIO_KEYSTORE_BASE64 }}
        run: |
          test -n "$FOLIO_KEYSTORE_BASE64"
          printenv FOLIO_KEYSTORE_BASE64 | base64 -d > "$RUNNER_TEMP/folio-release.keystore"
          chmod 600 "$RUNNER_TEMP/folio-release.keystore"

      - name: Read versionName
        id: ver
        run: |
          VERSION="$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$VERSION" ]]; then
              echo "Tag v${TAG_VERSION} does not match versionName ${VERSION}" >&2
              exit 1
            fi
          fi

      - name: Test and assemble release
        env:
          FOLIO_STORE_FILE: ${{ runner.temp }}/folio-release.keystore
          FOLIO_STORE_PASSWORD: ${{ secrets.FOLIO_STORE_PASSWORD }}
          FOLIO_KEY_ALIAS: folio
          FOLIO_KEY_PASSWORD: ${{ secrets.FOLIO_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --no-daemon

      - name: Package APK
        id: pkg
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          SRC=app/build/outputs/apk/release/app-release.apk
          test -f "$SRC"
          APK="folio-${VERSION}.apk"
          cp "$SRC" "$APK"
          sha256sum "$APK" | tee "${APK}.sha256"
          SIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort | tail -1)"
          "$SIGNER" verify --verbose --print-certs "$APK"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: folio-${{ steps.ver.outputs.version }}
          path: |
            folio-${{ steps.ver.outputs.version }}.apk
            folio-${{ steps.ver.outputs.version }}.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "${{ steps.ver.outputs.version }}" \
            --generate-notes \
            "${{ steps.pkg.outputs.apk }}" \
            "${{ steps.pkg.outputs.apk }}.sha256"
